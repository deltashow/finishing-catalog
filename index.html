<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج التشطيبات | DeltaShow</title>
    <link rel="icon" href="logods.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الخلفية الهندسية المتحركة -->
    <div class="geometric-bg">
        <div class="geo-shape circle"></div>
        <div class="geo-shape square"></div>
        <div class="geo-shape triangle"></div>
        <div class="geo-shape circle-2"></div>
        <div class="geo-shape square-2"></div>
    </div>

    <div class="container">
        <!-- هيدر اللوجو المضيء -->
        <header class="site-header">
            <div class="logo-wrapper">
            </div>
            <h2 class="brand-title">DeltaShow | قطاع التشطيبات</h2>
        </header>

        <h1>كتالوج التشطيبات الرقمي</h1>
        <p class="subtitle">اضغط على أي باقة لاستعراض التفاصيل الكاملة والمواصفات الهندسية والصور</p>

        <!-- شبكة الكروت التفاعلية -->
        <div class="catalog-grid" id="catalogContainer"></div>

        <!-- زر التواصل العام -->
        <div class="action-box">
            <a href="https://wa.me/01515323171" target="_blank" class="cta-btn">💬 تواصل معنا لتنفيذ وحدتك الخاصة</a>
        </div>

        <footer>
            <p>© 2026 DeltaShow. All Rights Reserved.</p>
        </footer>
    </div>

    <!-- نافذة منبثقة (Modal) لتفاصيل الباقة والصور عند الضغط عليها -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <div id="modalBody">
                <!-- يتم تعبئتها ديناميكياً بواسطة الجافاسكريبت -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
