<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج التشطيبات | DeltaShow</title>
    <link rel="icon" href="logods.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الخلفية الهندسية المتحركة الخاصة بشركة DeltaShow -->
    <div class="geometric-bg">
        <div class="geo-shape circle"></div>
        <div class="geo-shape square"></div>
        <div class="geo-shape triangle"></div>
        <div class="geo-shape circle-2"></div>
        <div class="geo-shape square-2"></div>
    </div>

    <div class="container">
        <!-- هيدر اللوجو الاحترافي المتحرك -->
        <header class="site-header">
            <div class="logo-wrapper">
                <img src="logods.png" alt="DeltaShow Logo" class="company-logo">
            </div>
            <h2 class="brand-title">DeltaShow | قطاع التشطيبات</h2>
        </header>

        <h1>كتالوج التشطيبات الرقمي</h1>
        <p class="subtitle">اختر الباقة الهندسية الأنسب لوحدتك.. جودة، دقة، وتصميم عصري</p>

        <!-- قسم عرض باقات التشطيبات التفاعلية -->
        <div class="catalog-grid" id="catalogContainer">
            <!-- سيتم تعبئة الكروت ديناميكياً بواسطة الجافاسكريبت -->
        </div>

        <!-- زر التواصل أو طلب معاينة -->
        <div class="action-box">
            <a href="https://wa.me/" target="_blank" class="cta-btn">💬 احجز استشارتك أو عاين وحدتك الآن</a>
        </div>

        <footer>
            <p>© 2026 DeltaShow. All Rights Reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
