<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج التشطيبات التفاعلي | Finishing Catalog</title>
    <link rel="stylesheet" href="finishing-catalog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="catalog-card">
        <h2>كتالوج خيارات التشطيب</h2>
        <div class="option">
            <label>نوع الأرضيات</label>
            <select id="flooring">
                <option value="500">سيراميك فرز أول (+500/م²)</option>
                <option value="1200">رخام إسباني (+1200/م²)</option>
            </select>
        </div>
        <div class="price-display">
            <span>التكلفة الإضافية للتشطيب:</span>
            <h3 id="finishPrice">75,000 ج.م</h3>
        </div>
    </div>
    <script src="finishing-catalog.js"></script>
</body>
</html>
